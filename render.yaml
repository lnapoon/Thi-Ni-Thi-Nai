services:
  - type: web
    name: thi-ni-thi-nai-rue
    runtime: python
    region: singapore
    buildCommand: "./build_files.sh && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --workers 3 --threads 2 --worker-class gthread --timeout 60 --keep-alive 5"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: checkin-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: "cloudinary"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: checkin-db
    plan: free
