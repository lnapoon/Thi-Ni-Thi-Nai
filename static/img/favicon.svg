  <path d="M32 14 C22.5 14 15 21.5 15 31 C15 42 30.5 53 31.2 53.8 C31.6 54.2 32.4 54.2 32.8 53.8 C33.5 53 49 42 49 31 C49 21.5 41.5 14 32 14 Z" 
